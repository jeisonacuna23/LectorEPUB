name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Instalar paquetes del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            libssl-dev

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar python-for-android
        run: pip install python-for-android

      - name: Compilar la APK
        run: |
          p4a apk \
            --private . \
            --package=com.milector.epub \
            --name="LectorEPUB" \
            --version=1.0 \
            --bootstrap=sdl2 \
            --requirements=python3,kivy,ebooklib \
            --arch=arm64-v8a \
            --android-api=34 \
            --ndk-api=21 \
            --permission=READ_EXTERNAL_STORAGE \
            --release

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: LectorEPUB-APK
          path: __p4a__/dist/*.apk
          retention-days: 30
